name: Paper build

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/paper-build.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/paper-build.yml'

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/native_carry_geometry.tex
          latexmk_use_xelatex: false
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: native-carry-geometry-paper
          path: paper/native_carry_geometry.pdf