name: Regenerate v0.3.0 theorem registry

on:
  push:
    branches:
      - agent/one-operator-one-zero-audit
    paths:
      - .audit-regenerate-v0.3.0

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regenerate:
    name: Elaborate and regenerate registry
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/one-operator-one-zero-audit

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
          use-mathlib-cache: true

      - name: Generate theorem registry from elaborated types
        run: python3 scripts/generate_theorem_registry.py --write

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeCarryGeometry/Audit/ExportTheoremTypes.lean audit
          if git diff --cached --quiet; then
            echo "Registry already current"
          else
            git commit -m "audit: regenerate v0.3.0 theorem evidence"
            git push origin HEAD:agent/one-operator-one-zero-audit
          fi
